<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROCCO Business Card V5 - Modern Asymmetric</title>
  <style>
    :root {
      --sheet-width: 978px;
      --sheet-height: 1304px;
      --card-height: 652px;
      --bg: #ffffff;
      --panel-bg: #f8f8f8;
      --text: #111111;
      --muted: #888888;
      --accent: #222222;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e0e0e0;
      font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Noto Sans SC", sans-serif;
      color: var(--text);
    }

    .sheet {
      width: var(--sheet-width);
      height: var(--sheet-height);
      background: var(--bg);
      position: relative;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.15);
      overflow: hidden;
    }

    .divider {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(var(--card-height) - 0.5px);
      border-top: 1px dashed rgba(0, 0, 0, 0.08);
      z-index: 10;
    }

    .card {
      height: var(--card-height);
      display: grid;
      grid-template-columns: 340px 1fr;
      position: relative;
    }

    .side-panel {
      background: var(--panel-bg);
      padding: 60px 50px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid rgba(0, 0, 0, 0.03);
    }

    .main-panel {
      padding: 60px 70px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .logo {
      width: 180px;
      height: auto;
      margin-bottom: 40px;
    }

    .qr-box {
      margin-top: auto;
    }

    .qr-img {
      width: 110px;
      height: 110px;
      margin-bottom: 12px;
    }

    .qr-hint {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1.5;
    }

    .name-section {
      margin-bottom: 60px;
    }

    .name {
      font-size: 76px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 10px;
      color: var(--accent);
    }

    .title {
      font-size: 26px;
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .contact-info {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .contact-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .value {
      font-size: 22px;
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    .footer-web {
      margin-top: auto;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding-top: 20px;
      border-top: 2px solid var(--accent);
      width: fit-content;
    }

    .lang-indicator {
      position: absolute;
      top: 30px;
      right: 30px;
      font-size: 10px;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: rgba(0, 0, 0, 0.2);
      writing-mode: vertical-rl;
    }
  </style>
</head>
<body>
  <div class="sheet">
    <!-- Chinese Card -->
    <section class="card card-zh">
      <div class="lang-indicator">CHINESE</div>
      <div class="side-panel">
        <img src="RoccoLogo.png" alt="ROCCO" class="logo">
        <div class="qr-box">
          <img src="黑白微信二维码.png" alt="QR" class="qr-img">
          <p class="qr-hint">微信扫码<br>即刻咨询</p>
        </div>
      </div>
      <div class="main-panel">
        <div class="name-section">
          <h1 class="name">李丹丹</h1>
          <p class="title">采购工程师</p>
        </div>
        <div class="contact-info">
          <div class="contact-row">
            <span class="label">Email</span>
            <span class="value">bella.li@roccofridge.com</span>
          </div>
          <div class="contact-row">
            <span class="label">Mobile</span>
            <span class="value">+86 18291966145</span>
          </div>
        </div>
        <div class="footer-web">ROCCOFRIDGE.COM</div>
      </div>
    </section>

    <div class="divider"></div>

    <!-- English Card -->
    <section class="card card-en">
      <div class="lang-indicator">ENGLISH</div>
      <div class="side-panel">
        <img src="RoccoLogo.png" alt="ROCCO" class="logo">
        <div class="qr-box">
          <img src="黑白微信二维码.png" alt="QR" class="qr-img">
          <p class="qr-hint">SCAN TO<br>GET IN TOUCH</p>
        </div>
      </div>
      <div class="main-panel">
        <div class="name-section">
          <h2 class="name">Bella Li</h2>
          <p class="title">Procurement Engineer</p>
        </div>
        <div class="contact-info">
          <div class="contact-row">
            <span class="label">Email</span>
            <span class="value">bella.li@roccofridge.com</span>
          </div>
          <div class="contact-row">
            <span class="label">Mobile</span>
            <span class="value">+86 18291966145</span>
          </div>
        </div>
        <div class="footer-web">ROCCOFRIDGE.COM</div>
      </div>
    </section>
  </div>
</body>
</html>

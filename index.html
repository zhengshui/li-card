<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROCCO Business Card V1</title>
  <style>
    :root {
      --sheet-width: 978px;
      --sheet-height: 1304px;
      --card-height: 652px;
      --pad-x: 68px;
      --pad-y: 56px;
      --line: rgba(12, 12, 12, 0.2);
      --text: #101010;
      --muted: rgba(16, 16, 16, 0.62);
      --bg: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(0, 0, 0, 0.04), transparent 24%),
        linear-gradient(180deg, #f2f2f2, #e4e4e4);
      font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Noto Sans SC", sans-serif;
      color: var(--text);
    }

    .sheet {
      width: var(--sheet-width);
      height: var(--sheet-height);
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 88% 8%, rgba(0, 0, 0, 0.05), transparent 22%),
        radial-gradient(circle at 10% 90%, rgba(0, 0, 0, 0.04), transparent 26%),
        var(--bg);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.12);
    }

    .divider {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(var(--card-height) - 0.5px);
      border-top: 1px dashed var(--line);
      z-index: 2;
      pointer-events: none;
    }

    .card {
      height: var(--card-height);
      padding: var(--pad-y) var(--pad-x);
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(300px, 360px);
      gap: 40px;
      position: relative;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 26px;
      border: 1px solid rgba(0, 0, 0, 0.05);
      pointer-events: none;
    }

    .left,
    .right {
      position: relative;
      z-index: 1;
      min-width: 0;
    }

    .left {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .tag {
      font-size: 14px;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .logo {
      width: 210px;
      max-width: 100%;
      height: auto;
    }

    .identity {
      margin-top: auto;
      padding-bottom: 8px;
    }

    .name {
      margin: 0;
      font-size: 72px;
      line-height: 0.98;
      font-weight: 500;
      letter-spacing: -0.05em;
    }

    .title {
      margin-top: 18px;
      font-size: 28px;
      line-height: 1.2;
      color: var(--muted);
      letter-spacing: -0.02em;
    }

    .right {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 18px;
    }

    .contact {
      padding-top: 20px;
      border-top: 1px solid rgba(0, 0, 0, 0.12);
    }

    .contact:first-child {
      margin-top: auto;
    }

    .label {
      margin-bottom: 8px;
      font-size: 12px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .value {
      font-size: 24px;
      line-height: 1.25;
      letter-spacing: -0.03em;
      word-break: break-word;
    }

    .qr-block {
      display: flex;
      align-items: center;
      gap: 18px;
      padding-bottom: 8px;
    }

    .qr {
      width: 132px;
      height: 132px;
      object-fit: contain;
      display: block;
    }

    .qr-note {
      font-size: 13px;
      line-height: 1.5;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="sheet">
    <section class="card card-zh">
      <div class="left">
        <div class="tag">Chinese Version</div>
        <img class="logo" src="RoccoLogo.png" alt="ROCCO" />
        <div class="identity">
          <h1 class="name">李丹丹</h1>
          <div class="title">采购主管</div>
        </div>
      </div>

      <div class="right">
        <div class="qr-block">
          <img class="qr" src="黑白微信二维码.png" alt="微信二维码" />
        </div>
        <div class="contact">
          <div class="label">Mail</div>
          <div class="value">bella.li@roccofridge.com</div>
        </div>
        <div class="contact">
          <div class="label">Mobile</div>
          <div class="value">+86 18291966145</div>
        </div>
        <div class="contact">
          <div class="label">Web</div>
          <div class="value">roccofridge.com</div>
        </div>
      </div>
    </section>

    <div class="divider" aria-hidden="true"></div>

    <section class="card card-en">
      <div class="left">
        <div class="tag">English Version</div>
        <img class="logo" src="RoccoLogo.png" alt="ROCCO" />
        <div class="identity">
          <h2 class="name">Bella Li</h2>
          <div class="title">Head of Sourcing</div>
        </div>
      </div>

      <div class="right">
        <div class="qr-block">
          <img class="qr" src="黑白微信二维码.png" alt="WeChat QR code" />
          <div class="qr-note">Scan to<br />connect on WeChat</div>
        </div>
        <div class="contact">
          <div class="label">Mail</div>
          <div class="value">bella.li@roccofridge.com</div>
        </div>
        <div class="contact">
          <div class="label">Mobile</div>
          <div class="value">+86 18291966145</div>
        </div>
        <div class="contact">
          <div class="label">Web</div>
          <div class="value">roccofridge.com</div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROCCO Business Card V6 - Classic Luxury</title>
  <style>
    :root {
      --sheet-width: 978px;
      --sheet-height: 1304px;
      --card-height: 652px;
      --bg: #fafafa;
      --text: #1a1a1a;
      --muted: #777777;
      --accent: #b0914f; /* Subtle gold-like accent for luxury feel */
      --border: rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #d4d4d4;
      font-family: "Optima", "Didot", "Georgia", "PingFang SC", "Noto Serif SC", serif;
      color: var(--text);
    }

    .sheet {
      width: var(--sheet-width);
      height: var(--sheet-height);
      background: var(--bg);
      position: relative;
      box-shadow: 0 50px 100px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .divider {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(var(--card-height) - 0.5px);
      border-top: 1px dashed rgba(0, 0, 0, 0.1);
      z-index: 10;
    }

    .card {
      height: var(--card-height);
      padding: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      position: relative;
    }

    .frame {
      position: absolute;
      inset: 40px;
      border: 1px solid var(--border);
      pointer-events: none;
    }

    .logo {
      width: 200px;
      height: auto;
    }

    .identity {
      margin: 40px 0;
    }

    .name {
      font-size: 72px;
      font-weight: 500;
      letter-spacing: 0.1em;
      margin-bottom: 12px;
      color: var(--text);
    }

    .title {
      font-size: 22px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      position: relative;
      display: inline-block;
      padding-bottom: 10px;
    }

    .title::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 25%;
      right: 25%;
      height: 1px;
      background: var(--accent);
    }

    .contact-container {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 120px 1fr;
      align-items: center;
      gap: 30px;
    }

    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: right;
    }

    .contact-list.left-align {
      text-align: left;
    }

    .contact-item {
      font-size: 18px;
      letter-spacing: 0.05em;
    }

    .contact-label {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0.2em;
      margin-right: 8px;
    }

    .qr-wrap {
      display: flex;
      justify-content: center;
    }

    .qr-img {
      width: 100px;
      height: 100px;
      filter: grayscale(1);
      opacity: 0.8;
    }

    .footer-web {
      font-size: 16px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 20px;
    }

    .lang-label {
      position: absolute;
      top: 55px;
      left: 70px;
      font-size: 10px;
      letter-spacing: 0.3em;
      color: var(--muted);
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="sheet">
    <!-- Chinese Card -->
    <section class="card card-zh">
      <div class="frame"></div>
      <div class="lang-label">中文版</div>
      
      <img src="RoccoLogo.png" alt="ROCCO" class="logo">
      
      <div class="identity">
        <h1 class="name">李丹丹</h1>
        <p class="title">采购工程师</p>
      </div>

      <div class="contact-container">
        <div class="contact-list">
          <div class="contact-item"><span class="contact-label">MAIL</span>bella.li@roccofridge.com</div>
          <div class="contact-item"><span class="contact-label">MOBILE</span>+86 18291966145</div>
        </div>
        
        <div class="qr-wrap">
          <img src="黑白微信二维码.png" alt="QR" class="qr-img">
        </div>

        <div class="contact-list left-align">
          <div class="contact-item"><span class="contact-label">WEB</span>roccofridge.com</div>
          <div class="contact-item"><span class="contact-label">WECHAT</span>Scan to connect</div>
        </div>
      </div>

      <div class="footer-web">ROCCOFRIDGE.COM</div>
    </section>

    <div class="divider"></div>

    <!-- English Card -->
    <section class="card card-en">
      <div class="frame"></div>
      <div class="lang-label">English</div>
      
      <img src="RoccoLogo.png" alt="ROCCO" class="logo">
      
      <div class="identity">
        <h2 class="name">Bella Li</h2>
        <p class="title">Procurement Engineer</p>
      </div>

      <div class="contact-container">
        <div class="contact-list">
          <div class="contact-item"><span class="contact-label">MAIL</span>bella.li@roccofridge.com</div>
          <div class="contact-item"><span class="contact-label">MOBILE</span>+86 18291966145</div>
        </div>
        
        <div class="qr-wrap">
          <img src="黑白微信二维码.png" alt="QR" class="qr-img">
        </div>

        <div class="contact-list left-align">
          <div class="contact-item"><span class="contact-label">WEB</span>roccofridge.com</div>
          <div class="contact-item"><span class="contact-label">SOCIAL</span>Scan to connect</div>
        </div>
      </div>

      <div class="footer-web">ROCCOFRIDGE.COM</div>
    </section>
  </div>
</body>
</html>

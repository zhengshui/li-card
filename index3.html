<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROCCO Business Card V3</title>
  <style>
    :root {
      --sheet-width: 978px;
      --sheet-height: 1304px;
      --card-height: 652px;
      --pad-x: 52px;
      --pad-y: 46px;
      --text: #121212;
      --muted: rgba(18, 18, 18, 0.58);
      --line: rgba(18, 18, 18, 0.18);
      --panel: rgba(255, 255, 255, 0.88);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #efefef, #d9d9d9);
      font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Noto Sans SC", sans-serif;
      color: var(--text);
    }

    .sheet {
      width: var(--sheet-width);
      height: var(--sheet-height);
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(246, 246, 246, 0.96)),
        repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.02) 0 1px, transparent 1px 120px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.14);
    }

    .divider {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(var(--card-height) - 0.5px);
      border-top: 1px dashed var(--line);
      z-index: 2;
      pointer-events: none;
    }

    .card {
      height: var(--card-height);
      padding: var(--pad-y) var(--pad-x);
    }

    .panel {
      height: 100%;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: var(--panel);
      backdrop-filter: blur(14px);
      display: grid;
      grid-template-columns: 100px minmax(0, 1fr) 290px;
      gap: 28px;
      padding: 34px 34px 30px;
    }

    .lang {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      align-self: start;
      font-size: 13px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .logo {
      width: 190px;
      height: auto;
      object-fit: contain;
    }

    .name {
      margin: 0;
      font-size: 70px;
      line-height: 0.98;
      font-weight: 500;
      letter-spacing: -0.05em;
    }

    .title {
      margin-top: 16px;
      font-size: 26px;
      line-height: 1.22;
      color: var(--muted);
    }

    .footer-line {
      margin-top: 34px;
      padding-top: 18px;
      border-top: 1px solid rgba(0, 0, 0, 0.1);
      display: flex;
      flex-wrap: wrap;
      gap: 18px 28px;
    }

    .chip {
      min-width: 220px;
      flex: 1 1 220px;
    }

    .chip-label {
      margin-bottom: 6px;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .chip-value {
      font-size: 22px;
      line-height: 1.28;
      letter-spacing: -0.03em;
      word-break: break-word;
    }

    .aside {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      min-width: 0;
    }

    .qr-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    .qr {
      width: 132px;
      height: 132px;
      object-fit: contain;
      display: block;
    }

    .qr-note {
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: right;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="sheet">
    <section class="card">
      <div class="panel">
        <div class="lang">Chinese</div>

        <div class="main">
          <div>
            <h1 class="name">李丹丹</h1>
            <div class="title">采购主管</div>
          </div>

          <div class="footer-line">
            <div class="chip">
              <div class="chip-label">Mail</div>
              <div class="chip-value">bella.li@roccofridge.com</div>
            </div>
            <div class="chip">
              <div class="chip-label">Mobile</div>
              <div class="chip-value">+86 18291966145</div>
            </div>
            <div class="chip">
              <div class="chip-label">Web</div>
              <div class="chip-value">roccofridge.com</div>
            </div>
          </div>
        </div>

        <div class="aside">
          <img class="logo" src="RoccoLogo.png" alt="ROCCO" />
          <div class="qr-wrap">
            <img class="qr" src="黑白微信二维码.png" alt="微信二维码" />
          </div>
        </div>
      </div>
    </section>

    <div class="divider" aria-hidden="true"></div>

    <section class="card">
      <div class="panel">
        <div class="lang">English</div>

        <div class="main">
          <div>
            <h2 class="name">Bella Li</h2>
            <div class="title">Head of Sourcing</div>
          </div>

          <div class="footer-line">
            <div class="chip">
              <div class="chip-label">Mail</div>
              <div class="chip-value">bella.li@roccofridge.com</div>
            </div>
            <div class="chip">
              <div class="chip-label">Mobile</div>
              <div class="chip-value">+86 18291966145</div>
            </div>
            <div class="chip">
              <div class="chip-label">Web</div>
              <div class="chip-value">roccofridge.com</div>
            </div>
          </div>
        </div>

        <div class="aside">
          <img class="logo" src="RoccoLogo.png" alt="ROCCO" />
          <div class="qr-wrap">
            <img class="qr" src="黑白微信二维码.png" alt="WeChat QR code" />
            <div class="qr-note">Scan to connect<br />on WeChat</div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
